env: local

# ==============================================================================
# 统一时序数据库配置 (可插拔时序存储引擎，支持各 DB 专属子配置)
# 切换数据库只需修改 `type` 字段 (tdengine | sqlite | postgresql | timescaledb | influxdb | iotdb | mock)
# ==============================================================================
tsdb:
  type: tdengine # 当前激活的驱动类型

  # 1. TDengine 专属配置
  tdengine:
    dsn: "root:taosdata@ws(127.0.0.1:6041)/things_tsdb"
    database: "things_tsdb"
    table: "device_properties"

  # 2. SQLite 专属配置
  sqlite:
    path: "data/things_tsdb.db" # 或 ":memory:"
    table: "device_properties"

  # 3. PostgreSQL 专属配置
  postgresql:
    dsn: "postgres://postgres:password@127.0.0.1:5432/things_db?sslmode=disable"
    table: "device_properties"

  # 4. TimescaleDB 专属配置
  timescaledb:
    dsn: "postgres://postgres:password@127.0.0.1:5432/things_db?sslmode=disable"
    table: "device_properties"

  # 6. InfluxDB 专属配置
  influxdb:
    url: "http://127.0.0.1:8086"
    token: "your-secret-token"
    org: "my-org"
    bucket: "things_tsdb"

  # 7. Apache IoTDB 专属配置
  iotdb:
    host: "127.0.0.1"
    port: "6667"
    storage_group: "root.things"

# Redis 设备影子连接配置
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# 与 backend 共用 AIoT 业务数据库；OTA 状态由 data-engine 写入其中。
data:
  db:
    aiot:
      driver: "mysql"
      dsn: "root:password@tcp(127.0.0.1:3306)/0things?parseTime=true&loc=Local"

event:
  driver: kafka
  kafka:
    brokers:
      - "127.0.0.1:9092"
    consumer_group: "aiot-data-engine"

log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/data-engine.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
