env: local
http:
  host: 127.0.0.1
  port: 8000
security:
  api_sign:
    app_key: change-me
    app_security: change-me
  logto:
    # Logto issuer is normally http://localhost:3001/oidc.
    issuer: http://localhost:3001/oidc
    audience: http://localhost:8000
    jwks_url: http://localhost:3001/oidc/jwks
    organization_claim: organization_id
    invitation_base_url: http://localhost:5173
    management:
      endpoint: http://localhost:3001
      app_id: ""
      app_secret: ""
      resource: https://default.logto.app/api
  # 端点凭据加密密钥；生产环境必须使用独立随机值。
  device_credentials_key: change-me-to-a-random-device-credentials-key
data:
  db:
    aiot:
      driver: sqlite
      dsn: storage/aiot-device.db
  storage:
    r2:
      endpoint: "https://<account-id>.r2.cloudflarestorage.com"
      bucket: ""
      region: "auto"
      access_key_id: ""
      secret_access_key: ""
      public_base_url: ""
      prefix: "ota"
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0
    read_timeout: 0.2s
    write_timeout: 0.2s
# ==============================================================================
# 统一时序数据库配置 (可插拔时序存储引擎，用于 /telemetry/history 历史曲线查询)
# 切换数据库只需修改 `type` 字段 (tdengine | sqlite | postgresql | timescaledb | influxdb | iotdb | mock)
# ==============================================================================
tsdb:
event:
  driver: kafka
  kafka:
    brokers:
      - "127.0.0.1:9092"
    consumer_group: "aiot-backend"

device_gateway:
  mqtt:
    host: mqtt.0things.com
    port: "1883"

mcp:
  name: 0things-iot-mcp
  version: 0.1.0
  stdio_enabled: true
  sse_enabled: false
  sse_addr: ":8008"
  streamable_http_enabled: true
  streamable_http_addr: ":8009"
log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/backend.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
