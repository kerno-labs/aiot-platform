apiVersion: v2
name: 0things
description: Helm chart for the 0things AIoT platform
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.24.0-0"
keywords:
  - aiot
  - iot
  - device-management
home: https://github.com/0things/0things-aiot-platform
sources:
  - https://github.com/0things/0things-aiot-platform
maintainers:
  - name: 0things
dependencies:
  - name: emqx-enterprise
    alias: emqx
    version: 6.3.1
    repository: https://repos.emqx.io/charts
    condition: emqx.enabled
  - name: cert-manager-alidns-webhook
    alias: alidns-webhook
    version: 0.1.5
    repository: oci://ghcr.io/crazygit/charts
    condition: alidns-webhook.enabled
