global:
  environment: local
  # Example for k3s: local-path. Leave empty to use the cluster default.
  storageClass: ""
  publicUrls:
    logto: http://localhost:3001
    logtoAdmin: http://localhost:3002

# Example for an existing Secret (also set registry.create: false): [my-registry-auth]
imagePullSecrets: []

registry:
  create: true
  server: ccr.ccs.tencentyun.com
  # Example: your registry username; keep real credentials in a private values file.
  username: ""
  # Example: your registry password; keep real credentials in a private values file.
  password: ""
  # Optional. Example: ops@example.com
  email: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: password
    database: aiot
  service:
    type: ClusterIP
    port: 5432
    nodePort: null
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

logtoPostgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: change-me-logto-db-password
    database: logto
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  auth:
    # Example: set a generated password for production; empty disables Redis AUTH.
    password: ""
  service:
    type: ClusterIP
    port: 6379
    nodePort: null
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nats:
  enabled: true
  image:
    repository: nats
    tag: 2.10-alpine
    pullPolicy: IfNotPresent
  auth:
    enabled: false
    username: nats
    # Example: set a generated password when auth.enabled is true.
    password: ""
  service:
    clientPort: 4222
    monitorPort: 8222
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kafka:
  enabled: true
  image:
    repository: apache/kafka
    tag: 4.3.1
    pullPolicy: IfNotPresent
  # Keep this ID unchanged while reusing the existing Kafka data volume.
  clusterId: gyGqtwZbThe9I3zcUvjGfw
  heapOpts: "-Xms512m -Xmx512m"
  service:
    clientPort: 9092
    controllerPort: 9093
  config:
    numPartitions: 3
    logRetentionHours: 168
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

emqx:
  enabled: true
  image:
    repository: emqx/emqx-enterprise
    tag: 6.3.1
    pullPolicy: IfNotPresent
  dashboard:
    username: admin
    password: public
  service:
    type: ClusterIP
    mqttPort: 1883
    websocketPort: 8083
    dashboardPort: 18083
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

tdengine:
  enabled: true
  image:
    repository: tdengine/tsdb
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    username: root
    password: taosdata
    database: things_tsdb
  service:
    type: ClusterIP
    nativePort: 6030
    websocketPort: 6041
    nativeNodePort: null
    websocketNodePort: null
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    dataSize: 20Gi
    logSize: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/0thing-prod/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  config:
    apiSign:
      appKey: change-me
      appSecret: change-me
    deviceCredentialsKey: change-me-to-a-random-device-credentials-key
    logto:
      audience: http://localhost:8000
      organizationClaim: organization_id
      managementAppId: change-me-logto-management-app-id
      managementAppSecret: change-me-logto-management-app-secret
      managementResource: https://default.logto.app/api
    r2:
      # Example: https://<account-id>.r2.cloudflarestorage.com
      endpoint: ""
      # Example: firmware
      bucket: ""
      region: auto
      # Example: your R2 access key ID.
      accessKeyId: ""
      # Example: your R2 secret access key; keep it in a private values file.
      secretAccessKey: ""
      # Example: https://firmware.example.com
      publicBaseUrl: ""
      prefix: ota
    deviceGateway:
      mqttHost: mqtt.example.com
      mqttPort: "1883"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

mcpServer:
  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/0thing-prod/mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8009
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

dataEngine:
  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/0thing-prod/data-engine
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

transportMqtt:
  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/0thing-prod/transport-mqtt
    tag: latest
    pullPolicy: IfNotPresent
  config:
    clientId: 0things-transport-mqtt
    # Example: an MQTT username configured in the broker.
    username: ""
    # Example: the password matching the broker user.
    password: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

aiCopilot:
  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/0thing-prod/ai-copilot
    tag: latest
    pullPolicy: IfNotPresent
  config:
    modelBaseUrl: https://api.openai.com/v1
    modelApiKey: change-me-ai-model-api-key
    modelId: gpt-4o-mini
  service:
    type: ClusterIP
    port: 8005
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/0thing-prod/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

logto:
  enabled: true
  replicaCount: 1
  image:
    repository: svhd/logto
    tag: 1.43.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    appPort: 3001
    adminPort: 3002
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

alidns-webhook:
  enabled: false
  aliyunAuth:
    existingSecret: alidns-credentials

# Configure these in values-prod.yaml to issue a certificate with AliDNS DNS-01.
clusterIssuer: {}
# Example:
# clusterIssuer:
#   name: letsencrypt-alidns
#   accessKeyID: REPLACE_WITH_ALIDNS_ACCESS_KEY_ID
#   accessKeySecret: REPLACE_WITH_ALIDNS_ACCESS_KEY_SECRET
#   dnsZones:
#     - example.com

certificate: {}
# Example:
# certificate:
#   name: example-com
#   issuerName: letsencrypt-alidns
#   dnsNames:
#     - example.com
#     - "*.example.com"

ingress:
  # Example for k3s: traefik
  className: nginx
  frontend:
    # Example: console.example.com
    host: ""
    path: /
    pathType: Prefix
  gateway:
    # Example: gateway.example.com
    host: ""
  logto:
    # Example: auth.example.com
    host: ""
    path: /
    pathType: Prefix
  logtoAdmin:
    # Example: auth-admin.example.com
    host: ""
    path: /
    pathType: Prefix
