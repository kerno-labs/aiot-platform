{{- if and .Values.transportMqtt.enabled (or (not .Values.emqx.enabled) (not .Values.kafka.enabled)) }}
{{- fail "transportMqtt.enabled requires emqx and kafka to be enabled" }}
{{- end }}
{{- if .Values.transportMqtt.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: transport-mqtt-config
  labels:
    {{- include "0things.labels" "transport-mqtt" | nindent 4 }}
data:
  local.yml: |
    env: {{ .Values.global.environment }}
    mqtt:
      broker: {{ printf "tcp://emqx:%d" (int .Values.emqx.service.mqtt) | quote }}
      client_id: {{ .Values.transportMqtt.config.clientId | quote }}
      username: {{ .Values.transportMqtt.config.username | quote }}
      password: {{ .Values.transportMqtt.config.password | quote }}
      tls:
        ca_file: ""
        cert_file: ""
        key_file: ""
    event:
      driver: kafka
      kafka:
        brokers:
          - {{ printf "kafka:%d" (int .Values.kafka.service.clientPort) | quote }}
        consumer_group: "aiot-transport-mqtt"
    log:
      log_level: {{ ternary "debug" "info" (ne .Values.global.environment "prod") }}
      mode: console
      encoding: console
---
{{- end }}
{{- if .Values.transportMqtt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-mqtt
  labels:
    {{- include "0things.labels" "transport-mqtt" | nindent 4 }}
spec:
  replicas: {{ .Values.transportMqtt.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "0things.labels" "transport-mqtt" | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/mqtt-config: {{ printf "%s:%d" (toJson .Values.transportMqtt.config) (int .Values.emqx.service.mqtt) | sha256sum }}
        checksum/event-config: {{ printf "kafka:%d:aiot-transport-mqtt" (int .Values.kafka.service.clientPort) | sha256sum }}
      labels:
        {{- include "0things.labels" "transport-mqtt" | nindent 8 }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: transport-mqtt
          image: "{{ .Values.transportMqtt.image.repository }}:{{ .Values.transportMqtt.image.tag }}"
          imagePullPolicy: {{ .Values.transportMqtt.image.pullPolicy }}
          env:
            - name: APP_CONF
              value: config/local.yml
          resources:
            {{- toYaml .Values.transportMqtt.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /data/app/config/local.yml
              subPath: local.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: transport-mqtt-config
{{- end }}
